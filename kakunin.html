<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>日報を見る｜よつば建設工業</title>
<link rel="icon" type="image/png" sizes="32x32" href="icons/kakunin-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/kakunin-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/kakunin-180.png">
<link rel="manifest" href="manifest-kakunin.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="日報確認">
<meta name="theme-color" content="#1c4b34">
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<style>
  :root{
    --green:#1c4b34; --tint:#e6ede8;
    --ink:#201e1d; --muted:#605d5d; --faint:#7d7979; --dim:#9b9797;
    --line:rgba(32,30,29,.2); --line-s:rgba(32,30,29,.26); --line-w:rgba(32,30,29,.14);
    --paper:#f3f2f2; --card:#faf9f7; --field:#eae9e9;
    --mag:#d6006c; --mag-d:#8e0b4c;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{font-family:"Hiragino Sans","Yu Gothic UI","Noto Sans JP",sans-serif;
    background:var(--paper);color:var(--ink);line-height:1.6;}
  button{font-family:inherit;}
  .wrap{max-width:520px;margin:0 auto;padding:22px 20px 50px;}

  .brand{font-size:12px;letter-spacing:.14em;color:var(--muted);}
  h1.big{margin:10px 0 4px;font-size:34px;font-weight:700;letter-spacing:-.01em;line-height:1.1;}
  .sub{font-size:14px;color:var(--muted);}

  .bar-top{display:flex;align-items:center;gap:14px;padding:14px 20px;
    border-bottom:1px solid var(--line-w);background:var(--paper);position:sticky;top:0;z-index:5;}
  .bar-top .bk{background:transparent;border:none;font-size:16px;color:var(--muted);cursor:pointer;padding:4px 0;}
  .bar-top .tt{font-size:17px;font-weight:600;}
  .bar-top select{margin-left:auto;padding:8px;border:1px solid var(--line);border-radius:2px;
    background:var(--card);font-family:inherit;font-size:14px;color:var(--ink);}

  input[type=text]{width:100%;min-height:56px;padding:14px 16px;background:var(--field);
    border:1px solid var(--line);border-radius:2px;font-size:18px;color:var(--ink);outline:none;font-family:inherit;}
  input:focus{border:1.5px solid var(--green);}

  .step{font-size:13px;color:var(--muted);margin-bottom:8px;font-weight:600;}
  .ngrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  .nchip{height:62px;padding:0 6px;background:var(--card);color:var(--ink);border:1px solid var(--line-s);
    border-radius:2px;font-size:19px;white-space:nowrap;overflow:hidden;cursor:pointer;}
  .nchip:active{background:var(--tint);border-color:var(--green);}

  .vtabs{display:flex;gap:8px;margin-bottom:18px;}
  .vtabs button{flex:1;min-height:50px;padding:12px 8px;background:transparent;color:var(--ink);
    border:1px solid var(--line-s);border-radius:2px;font-size:17px;cursor:pointer;}
  .vtabs button.on{background:var(--green);color:#f3f2f2;border-color:var(--green);font-weight:600;}

  /* ---- 月合計：出勤日数と残業だけ大きく。総合計は出さない ---- */
  .figs2{display:flex;gap:16px 28px;flex-wrap:wrap;align-items:baseline;margin-top:6px;}
  .figs2 .f .l{font-size:13px;color:var(--muted);}
  .figs2 .f .v{font-size:42px;font-weight:700;line-height:1.1;}
  .figs2 .f .v span{font-size:16px;font-weight:400;color:var(--muted);margin-left:4px;}
  .figs2 .f .v.z{color:var(--dim);}
  .klist{margin-top:20px;}
  .klist .kr{display:flex;align-items:baseline;justify-content:space-between;gap:12px;
    padding:9px 0;border-bottom:1px solid var(--line-w);}
  .klist .kr .n{font-size:16px;}
  .klist .kr .t{font-size:19px;font-weight:600;font-variant-numeric:tabular-nums;}
  .klist .kr.mn .n,.klist .kr.mn .t{color:var(--mag-d);}
  .sec-lbl{font-size:13px;color:var(--muted);font-weight:600;margin:26px 0 4px;}

  /* ---- 1日ごと：内訳を同じくらいの大きさで横に並べる ---- */
  .vday{padding:14px 0;border-bottom:1px solid var(--line-w);}
  .vday .top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;}
  .vday .d{font-size:14px;color:var(--muted);}
  .vday .tot{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;}
  .vday .j{margin-top:4px;font-size:17px;}
  .vday .j .no{font:600 16px/1.2 ui-monospace,monospace;letter-spacing:.05em;color:var(--green);margin-right:8px;}
  .vday .h{margin-top:6px;font-size:12px;color:var(--faint);}
  .vday.off .j{color:var(--muted);}
  .brk{margin-top:6px;font-size:15.5px;line-height:1.8;color:var(--ink);}
  .brk .mn{color:var(--mag-d);font-weight:600;}
  .brk .sep{color:var(--faint);margin:0 5px;}
  .brk .z{color:var(--faint);}
  /* 出張・夜勤のタグ。管理画面の明細一覧と同じ見た目 */
  .tgs{margin-top:5px;}
  .tg{display:inline-block;padding:2px 7px;background:var(--field);color:var(--muted);
    border-radius:2px;font-size:13px;margin-right:4px;}
  .vsent{padding:15px 0;border-bottom:1px solid var(--line-w);}
  .vsent .at{font-size:13px;color:var(--faint);}
  .vsent .j{margin-top:5px;font-size:17px;}
  .vsent .j .no{font:600 16px/1.2 ui-monospace,monospace;letter-spacing:.05em;color:var(--green);margin-right:8px;}
  .vsent .s{margin-top:5px;font-size:14px;color:var(--muted);}
  .paybox{margin-top:26px;padding-top:20px;border-top:1px solid var(--line);}
  .paybox .n{font-size:40px;font-weight:700;}
  .paybox .n span{font-size:15px;font-weight:400;color:var(--muted);margin-left:8px;}
  .payrow{display:flex;align-items:baseline;justify-content:space-between;gap:10px;
    padding:10px 0;border-bottom:1px solid var(--line-w);font-size:15px;}
  .payrow .x{color:var(--faint);font-size:14px;}

  .note{font-size:13px;color:var(--faint);margin-top:14px;line-height:1.6;}
  .empty{text-align:center;color:var(--faint);font-size:14px;padding:40px 0;}
  .updated{font-size:11px;color:var(--faint);text-align:center;margin-top:16px;}
  .screen{display:none;} .screen.on{display:block;}

  /* ---- ホーム ---- */
  .mebtn{display:block;width:100%;text-align:left;margin-top:26px;padding:22px 20px;border-radius:2px;
    background:var(--green);color:#f3f2f2;border:none;font-size:25px;font-weight:600;line-height:1.2;
    cursor:pointer;font-family:inherit;}
  .mebtn .s{font-size:13.5px;font-weight:400;margin-top:7px;color:rgba(243,242,242,.75);}
  .obtn{display:block;width:100%;text-align:left;padding:18px;border-radius:2px;background:transparent;
    color:var(--ink);border:1px solid var(--line-s);font-size:18px;cursor:pointer;font-family:inherit;
    line-height:1.25;}
  .obtn .s{font-size:13px;font-weight:400;margin-top:6px;color:var(--muted);}
  .obtn.open{background:var(--tint);border:1.5px solid var(--green);color:var(--green);font-weight:600;}
  .obtn.open .s{color:var(--green);}
  /* 会社のボタンは、名前のボタンとはっきり分ける */
  .cobox{margin-top:10px;padding:14px;background:var(--card);border:1px solid var(--line-w);border-radius:2px;}
  .cobox .lb{font-size:12.5px;color:var(--faint);margin-bottom:9px;}
  .mebar{display:flex;align-items:baseline;gap:10px;margin-top:10px;padding:11px 14px;
    background:var(--card);border:1px solid var(--line-w);border-radius:2px;}
  .mebar .l{font-size:12.5px;color:var(--faint);}
  .mebar .n{font-size:16px;font-weight:600;}
  .mebar .ch{margin-left:auto;background:transparent;border:none;font-size:13.5px;font-family:inherit;
    color:var(--muted);text-decoration:underline;cursor:pointer;padding:4px 0;}
  .cogrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;}
  .cogrid button{min-height:64px;padding:11px 10px;background:var(--card);color:var(--ink);
    border:1px solid var(--line-s);border-radius:2px;font-size:16.5px;cursor:pointer;
    font-family:inherit;line-height:1.3;text-align:left;}
  .cogrid button .c{display:block;margin-top:4px;font-size:12.5px;color:var(--faint);}
  .lnk{background:transparent;border:none;font-size:15px;color:var(--muted);text-decoration:underline;
    cursor:pointer;font-family:inherit;padding:6px 0;}

  /* ---- 会社の中の人ごと ---- */
  .prow{display:block;width:100%;text-align:left;padding:13px 15px;background:var(--card);
    border:1px solid var(--line-w);border-radius:2px;margin-bottom:8px;cursor:pointer;font-family:inherit;}
  .prow .t1{display:flex;align-items:baseline;justify-content:space-between;gap:10px;}
  .prow .nm{font-size:18px;font-weight:600;}
  .prow .dy{font-size:14px;color:var(--muted);}

  /* ---- 一緒に行った人 ---- */
  .mates{margin-top:6px;font-size:14.5px;color:var(--muted);line-height:1.7;}
  .mates b{font-weight:600;color:var(--ink);}
</style>
</head>
<body>

<!-- ===== 初回だけ：この端末を使う人を選ぶ ===== -->
<div id="scPick" class="screen">
<div class="wrap">
  <div class="brand">よつば建設工業</div>
  <h1 class="big" style="font-size:30px">お名前を選んでください</h1>
  <div class="sub" id="pkSub"></div>

  <button class="obtn" id="pkCoBtn" style="margin-top:22px" onclick="toggleCo()">会社で選ぶ
    <div class="s">協力会社の記録を、会社ごとにまとめて見ます</div></button>
  <div id="pkCos" style="display:none"></div>

  <div class="sec-lbl">この端末を使う人を選ぶ</div>
  <div><input type="text" id="pkSearch" placeholder="名前で探す"></div>
  <div id="pkList" style="margin-top:18px"></div>
  <button class="lnk" id="pkCancel" style="display:none;margin-top:18px" onclick="goHome()">やめる</button>
</div>
</div>

<!-- ===== ホーム ===== -->
<div id="scHome" class="screen on">
<div class="wrap">
  <div class="brand">よつば建設工業</div>
  <h1 class="big">日報を見る</h1>
  <div class="sub">自分の記録・今月の工数</div>

  <button class="mebtn" id="homeMe" onclick="openView(ME,'home')"></button>
  <div class="mebar">
    <span class="l">この端末</span><span class="n" id="homeMeName"></span>
    <button class="ch" onclick="openPick(true)">名前を変える</button>
  </div>

  <div class="sec-lbl">ほかの人を見る</div>
  <button class="obtn" onclick="goNames()">名前の一覧から選ぶ</button>
  <p class="updated" id="updTop"></p>
</div>
</div>

<!-- ===== 名前の一覧 ===== -->
<div id="scNames" class="screen">
  <div class="bar-top"><button class="bk" onclick="goHome()">戻る</button><span class="tt">名前から選ぶ</span></div>
  <div class="wrap">
    <div><input type="text" id="vSearch" placeholder="名前で探す"></div>
    <div id="vNameList" style="margin-top:18px"></div>
    <p class="note">名前をタップすると、月ごとの日報が見られます。表示のみで、ここから記録は変えられません。</p>
  </div>
</div>

<!-- ===== 協力会社ごと ===== -->
<div id="scCo" class="screen">
  <div class="bar-top">
    <button class="bk" onclick="backFromCo()">戻る</button>
    <span class="tt" id="coTitle"></span>
    <select id="coMonth"></select>
  </div>
  <div class="wrap">
    <div style="font-size:13px;color:var(--muted)" id="coMonthLbl"></div>
    <div class="figs2" id="coFigs"></div>
    <div class="klist" id="coKinds"></div>
    <div class="sec-lbl">人ごと</div>
    <div id="coPeople"></div>
    <div class="note">月末の突き合わせ用です。名前をタップすると、その人の日ごとの記録が見られます。</div>
  </div>
</div>

<div id="scView" class="screen">
  <div class="bar-top">
    <button class="bk" onclick="backFromView()">戻る</button>
    <span class="tt" id="vTitle"></span>
    <select id="vMonth"></select>
  </div>
  <div class="wrap">
    <div class="vtabs" id="vTabs"></div>
    <div id="vMe">
      <div style="font-size:13px;color:var(--muted)" id="vMonthLbl"></div>
      <div class="figs2" id="vFigs"></div>
      <div class="klist" id="vKinds"></div>
      <div class="sec-lbl">日ごとの記録</div>
      <div id="vDays"></div>
      <div class="paybox" id="vPay"></div>
      <div class="paybox" id="vKs"></div>
      <div class="note">ここは自分の記録だけです。数字が違うときは職長か事務所に言ってください。</div>
    </div>
    <div id="vSent" style="display:none">
      <div class="note" style="margin-top:0">自分が職長で出した日報</div>
      <div id="vSentList" style="margin-top:10px"></div>
      <div class="note">他の職長が出した日報や、他人の月合計は見られません（事務所の管理画面のみ）。</div>
    </div>
  </div>
</div>

<script>
/* ================== Firebase ================== */
const firebaseConfig = {
  apiKey: "AIzaSyDRTF3YW0oTbMcN3cwsmMDJWoLX4HpVtPk",
  authDomain: "yotsuba-nippo.firebaseapp.com",
  databaseURL: "https://yotsuba-nippo-default-rtdb.firebaseio.com",
  projectId: "yotsuba-nippo",
  storageBucket: "yotsuba-nippo.firebasestorage.app",
  messagingSenderId: "1007360975873",
  appId: "1:1007360975873:web:ac229f3f4016b81e994c00"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const PAPER_KINDS = ["平日工場","平日現場","休日工場","休日現場","工場残業","現場残業","移動行き","移動帰り","早出","深夜","突発"];
const WORK_KINDS = ["平日工場","平日現場","休日工場","休日現場"];
const OT_KINDS   = ["工場残業","現場残業"];   /* 「残業」として大きく出す分 */
/* 月合計の一覧に並べる項目（残業は上に大きく出すので、ここには入れない） */
const LIST_KINDS = PAPER_KINDS.filter(k=>OT_KINDS.indexOf(k)<0);
const WD = ["日","月","火","水","木","金","土"];
const YAKUIN = ["野村","松高","高市","水元","井谷","本山","大西"];
const MGROUPS = ["自社","常駐協力","外注協力"];
const ALLOW_BORDER = 4;   /* 実働がこの時間以下なら 0.5 */
/* 読み込みの途中でも画面を切り替えられるように、ここで決めておく */
const SCREENS = ["scPick","scHome","scNames","scCo","scView"];

/* WRAW＝名簿をキーつきのまま持っておく（開いた日を書くとき、名前からキーをさがすため） */
let ALLDATA = {}, WORKERS = [], WRAW = {};
let V = { name:null, month:null, tab:"me", from:"home", co:null, coMonth:null, coFrom:"home" };

/* この端末を使う人。送信アプリと同じ鍵（同じ場所に置いてあるので共通） */
const ME_KEY = "yotsuba.me";
let ME = "";
try{ ME = localStorage.getItem(ME_KEY) || ""; }catch(e){ ME = ""; }
let pkCanCancel = false, pkCoOpen = false;

function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function isKana(s){ return /^[ァ-ヴー]+$/.test(s); }
function byLen(a,b){ return (isKana(a)-isKana(b))||(a.length-b.length)||a.localeCompare(b,"ja"); }
function f1(v){ return (Math.round((v||0)*10)/10).toFixed(1); }
function totalOf(h){ h=h||{}; return PAPER_KINDS.reduce((a,k)=>a+(h[k]||0),0); }
function netOf(r){ return Math.max(0, totalOf(r.h)-(r.late||0)-(r.early||0)); }
function monthRows(m){ return (ALLDATA[m]&&ALLDATA[m].rows)?ALLDATA[m].rows.filter(Boolean):[]; }
function allRows(){ return Object.keys(ALLDATA).reduce((a,m)=>a.concat(monthRows(m)),[]); }
function jobKey(r){ return r.no || r.j || ""; }
function dShort(ds){ const d=new Date(ds+"T00:00:00");
  return isNaN(d)?ds:((d.getMonth()+1)+"/"+d.getDate()+"（"+WD[d.getDay()]+"）"); }

/* 旧データの「協力」は「常駐協力」として扱う */
function mGroupOfK(k){
  if(!k || k==="自社") return "自社";
  if(k==="外注協力") return "外注協力";
  return "常駐協力";
}
/* ---- 職長手当（工数） ----
   管理画面（kanri.html）の leadUnit・leadAgg と同じ数え方。直すときは両方そろえること。
   1人1日ごとに数える。同じ職長・同じ日・同じ人が何件かあれば、時間を足してから決める。
     基本時間（遅刻・早退を引いた後）が 4時間より多い→1、4時間まで→0.5、0→0
   本人も数える。役員7名は数えない。休みの人は入れない。
   手で直した数（行の fa）は使わない */
function r1(v){ return Math.round((v||0)*10)/10; }
/* 実働＝平日/休日の工場・現場の合計から遅刻・早退を引いたもの */
function workNetOf(r){
  const h=r.h||{};
  const w=WORK_KINDS.reduce((a,k)=>a+(h[k]||0),0);
  return Math.max(0, w-(r.late||0)-(r.early||0));
}
/* 1人1日のカウント。役員は null（数えない） */
function leadUnit(n, w){
  if(YAKUIN.indexOf(n)>=0) return null;
  if(w<=0) return 0;
  return w<=ALLOW_BORDER ? 0.5 : 1;
}
/* 職長ごとのまとまり。職長 → 日 → 人 の順にまとめて、人ごとに時間を足す。
   返すもの：[{f:職長, sum:合計, days:[{d, nos, jobs, ppl:[{n,w,ot,u}], sum}]}] */
function leadAgg(rows){
  const by={};
  (rows||[]).forEach(r=>{
    if(!r.f || !r.n || r.off) return;
    const L=by[r.f]=by[r.f]||{};
    const D=L[r.d]=L[r.d]||{nos:[], jobs:[], ppl:{}};
    if(r.no && D.nos.indexOf(r.no)<0) D.nos.push(r.no);
    const jn=r.j||r.no||"";
    if(jn && D.jobs.indexOf(jn)<0) D.jobs.push(jn);
    const P=D.ppl[r.n]=D.ppl[r.n]||{n:r.n, w:0, ot:0};
    P.w  += workNetOf(r);
    P.ot += OT_KINDS.reduce((a,k)=>a+((r.h&&r.h[k])||0),0);
  });
  return Object.keys(by).sort(byLen).map(f=>{
    const days=Object.keys(by[f]).sort().map(d=>{
      const D=by[f][d];
      const ppl=Object.values(D.ppl).map(p=>Object.assign(p, {w:r1(p.w), u:leadUnit(p.n, r1(p.w))}))
        .sort((a,b)=>(b.n===f)-(a.n===f) || byLen(a.n, b.n));
      return {d:d, nos:D.nos, jobs:D.jobs, ppl:ppl, sum:ppl.reduce((a,p)=>a+(p.u||0),0)};
    });
    return {f:f, days:days, sum:days.reduce((a,x)=>a+x.sum,0)};
  });
}
function allowTx(v){ return (Math.round((v||0)*10)/10).toFixed(1); }

/* ---- 監督・指揮者の手当（JFE・神戸製鋼・大洲バイオマス） ----
   管理画面（kanri.html）の ksList・isKsRow・ksAgg と同じ数え方。直すときは両方そろえること。
   日報アプリの「監督・指揮者モード」で送った日報（行に kan か shiki が入っている）だけを数える。
   監督なし（指揮者だけ）の日報は、kan が空で shiki だけ入っている。
   監督・指揮者に、人数に関係なく1日1回ずつ。同じ人・同じ日・同じ役割が2枚に入っていても1回 */
/* Firebase は並びを {0:…,1:…} の形で返すことがあるので、いつも配列にしてから使う */
function ksList(v){
  if(Array.isArray(v)) return v.filter(Boolean);
  if(v && typeof v==="object") return Object.keys(v).sort().map(k=>v[k]).filter(Boolean);
  return v ? [String(v)] : [];
}
function isKsRow(r){ return !!(r && (r.kan || ksList(r.shiki).length)); }
/* 人ごとのまとまり。返すもの：[{n, kan:監督の回数, shiki:指揮者の回数,
     items:[{d, role, kubun:[], jobs:[], kan:[], shiki:[], noKan, noShiki}]}]（items は日付順、同じ日は監督が先）
   noKan／noShiki＝まとめた日報のどれかに、監督／指揮者がいなかった */
function ksAgg(rows){
  const by={}, seen={};
  const add=(arr, v)=>{ if(v && arr.indexOf(v)<0) arr.push(v); };
  (rows||[]).forEach(r=>{
    if(!isKsRow(r) || r.off) return;
    const sh=ksList(r.shiki);
    (r.kan?[[r.kan,"監督"]]:[]).concat(sh.map(s=>[s,"指揮者"])).forEach(x=>{
      const n=x[0], role=x[1], key=n+"|"+r.d+"|"+role;
      const P=by[n]=by[n]||{n:n, kan:0, shiki:0, items:[]};
      let it=seen[key];
      if(!it){
        it=seen[key]={d:r.d, role:role, kubun:[], jobs:[], kan:[], shiki:[], noKan:false, noShiki:false};
        P.items.push(it);
        if(role==="監督") P.kan++; else P.shiki++;
      }
      add(it.kubun, r.kubun); add(it.jobs, r.j||r.no||""); add(it.kan, r.kan);
      sh.forEach(s=>add(it.shiki, s));
      if(!r.kan) it.noKan=true;
      if(!sh.length) it.noShiki=true;
    });
  });
  return Object.keys(by).sort(byLen).map(n=>{
    by[n].items.sort((a,b)=>String(a.d).localeCompare(String(b.d)) ||
      (a.role==="監督"?0:1)-(b.role==="監督"?0:1));
    return by[n];
  });
}

/* 同じ送信のかたまり。batch がない古い行は 日付＋工事＋職長 でまとめる */
function bKey(r){ return r.batch || (r.d+"|"+jobKey(r)+"|"+(r.f||"")); }
/* その日、同じ送信に入っていた他の人（休みの人は入れない） */
function matesOf(r, rows){
  const k=bKey(r);
  const out=[];
  rows.forEach(x=>{
    if(x===r || x.off || !x.n || x.n===r.n) return;
    if(bKey(x)!==k) return;
    if(out.indexOf(x.n)<0) out.push(x.n);
  });
  return out;
}

/* 1日ぶんの内訳を、同じくらいの大きさで横に並べる */
function brkHtml(r){
  const h=r.h||{};
  const p=PAPER_KINDS.filter(k=>h[k]).map(k=>'<span>'+esc(k)+' '+f1(h[k])+'</span>');
  if(r.late)  p.push('<span class="mn">遅刻 −'+f1(r.late)+'</span>');
  if(r.early) p.push('<span class="mn">早退 −'+f1(r.early)+'</span>');
  return p.length ? p.join('<span class="sep">／</span>') : '<span class="z">―</span>';
}

/* 名簿。会社の並べ分けと、名前の登録に使う */
function mGroupOfW(w){
  if(!w) return "自社";
  if(w.kubun==="自社") return "自社";
  if(w.kubun==="外注協力") return "外注協力";
  return "常駐協力";
}
function activeWorkers(){ return WORKERS.filter(w=>w.active!==false); }
/* 協力会社（所属）の一覧。名簿がまだ読めていなければ日報の行から拾う */
function companies(){
  const co={};
  activeWorkers().filter(w=>mGroupOfW(w)!=="自社").forEach(w=>{
    const k=w.shozoku||"所属なし"; (co[k]=co[k]||new Set()).add(w.name);
  });
  allRows().forEach(r=>{
    if(!r.n || mGroupOfK(r.k)==="自社") return;
    const w=WORKERS.find(x=>x.name===r.n);
    const k=(w&&w.shozoku)||r.shozoku||"所属なし";
    (co[k]=co[k]||new Set()).add(r.n);
  });
  return Object.keys(co).sort((a,b)=>a.localeCompare(b,"ja"))
    .map(k=>({name:k, members:[...co[k]].sort(byLen)}));
}
/* 名簿にいる全員（登録用） */
function pickNames(){
  const out={};
  activeWorkers().forEach(w=>{ if(w.name) out[w.name]=mGroupOfW(w); });
  allRows().forEach(r=>{ if(r.n && !out[r.n]) out[r.n]=mGroupOfK(r.k); });
  return out;
}

/* ---- だれが使いはじめたか（管理画面のメンバータブで見る） ----
   名前がえらばれている状態で開いたら、master/seen/{名簿のキー}/kakunin に
   最後に開いた日（d）と、ホーム画面のアイコンから開いた日（icon）を書く。1日1回だけ
   （アイコンから開いたのがその日はじめてなら、もう1回）。日報（nippo/…）と名簿には書かない。
   送信アプリ（nippo.html）・かんたん日報（jochu.html）にも同じ markSeen がある。直すときはそろえること */
const SEEN_APP = "kakunin";
let seenSent = "";
function markSeen(){
  if(!ME) return;
  const key = Object.keys(WRAW).find(k=>WRAW[k] && WRAW[k].name===ME);
  if(!key) return;
  const t = new Date();
  const d = t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0")+"-"+String(t.getDate()).padStart(2,"0");
  const icon = !!((window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) ||
    window.navigator.standalone===true);
  const lk = "yotsuba.seen."+SEEN_APP;
  let last = {};
  try{ last = JSON.parse(localStorage.getItem(lk)||"{}") || {}; }catch(e){ last = {}; }
  const same = last.k===key && last.d===d;
  if(same && (last.icon || !icon)) return;
  const sig = key+"|"+d+"|"+icon;
  if(seenSent===sig) return;
  seenSent = sig;
  const up = {d:d};
  if(icon) up.icon = d;
  db.ref("master/seen/"+key+"/"+SEEN_APP).update(up).then(()=>{
    try{ localStorage.setItem(lk, JSON.stringify({k:key, d:d, icon:icon || (same && !!last.icon)})); }catch(e){}
  }).catch(()=>{ seenSent = ""; });
}

    if(lt) p.push('<span class="mn">遅刻 −'+f1(lt)+'</span>');

    return '<button class="prow" data-n="'+esc(n)+'">'+

  const sum=k=>work.reduce((a,r)=>a+((r.h&&r.h[k])||0),0);

  /* 出張・夜勤は1日1回。同じ日に2件送られていても、その日は1回。0回のときは出さない */
  const tripD=new Set(work.filter(r=>r.s).map(r=>r.d)).size;

  const lateT=work.reduce((a,r)=>a+(r.late||0),0);

  const krows=LIST_KINDS.filter(k=>sum(k)).map(k=>
    '<div class="kr"><span class="n">'+esc(k)+'</span><span class="t">'+f1(sum(k))+'</span></div>');

    '<div style="margin-top:12px">'+payRows+'</div>'+
    '<div class="note">自分を含めて、1人1日ごとに数えます。同じ日に何件か出していても、同じ人の時間は足してから数えます。実働（平日・休日の工場現場から遅刻・早退を引いた分）が4時間より多ければ1.0、4時間までなら0.5です。実働がない人（移動・残業だけ）、役員7名、休みの人は数えません。手で直した数は使いません。</div>':"";

  /* 監督・指揮者（JFE・神戸製鋼・大洲バイオマス）。職長手当とは別。回数が0の人には出さない */
  const ks=ksAgg(rows).find(x=>x.n===V.name);
  document.getElementById("vKs").style.display=ks?"block":"none";
  document.getElementById("vKs").innerHTML=ks?
    '<div class="step">監督・指揮者（'+(V.month||"").replace("-","年")+'月）</div>'+
    '<div class="figs2">'+
      '<div class="f"><div class="l">監督</div><div class="v'+(ks.kan?"":" z")+'">'+ks.kan+'<span>回</span></div></div>'+
      '<div class="f"><div class="l">指揮者</div><div class="v'+(ks.shiki?"":" z")+'">'+ks.shiki+'<span>回</span></div></div>'+
    '</div>'+
    '<div style="margin-top:12px">'+ks.items.slice().reverse().map(it=>
      '<div class="payrow"><span>'+dShort(it.d)+'　'+esc(it.kubun.join("・"))+'　'+esc(it.jobs.join("／"))+'</span>'+
      '<span style="flex:none;white-space:nowrap;font-weight:600">'+esc(it.role)+'</span></div>').join("")+'</div>'+
    '<div class="note">JFE・神戸製鋼・大洲バイオマスの現場で、監督・指揮者になった日です。人数に関係なく、1日1回ずつ数えます（同じ日に2枚あっても1回）。</div>':"";

  /* 出した日報（送信ごと）。職長手当は日ごとに数えるので、ここには出さない */
  const bt={};
  sent.forEach(r=>{ const k=r.batch||(r.d+"|"+jobKey(r)); (bt[k]=bt[k]||[]).push(r); });
  const keys=Object.keys(bt).sort((a,b)=>String(bt[b][0].d).localeCompare(String(bt[a][0].d)));
  document.getElementById("vSentList").innerHTML=keys.length?keys.map(k=>{
    const g=bt[k], r=g[0];
    const work=g.filter(x=>!x.off), offs=g.filter(x=>x.off);
    const t=work.reduce((a,x)=>a+netOf(x),0);
    return '<div class="vsent"><div class="at">'+dShort(r.d)+(r.at?"　"+esc(String(r.at).split(" ")[1]||"")+" 送信":"")+'</div>'+
      '<div class="j">'+(r.no?'<span class="no">'+esc(r.no)+'</span>':'')+esc(r.j||"")+'</div>'+
      '<div class="s">'+work.length+'人 ／ 合計 '+f1(t)+'時間'+(offs.length?' ／ 休み '+offs.length+'人':'')+'</div></div>';
  }).join(""):'<div class="empty">この月に出した日報はありません</div>';
}

/* ================== 起動 ================== */
/* 名前が登録してあれば、開いたらすぐ自分の記録を出す */
if(ME) openView(ME,"home"); else openPick(false);
</script>
</body>
</html>
