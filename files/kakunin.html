<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>日報を見る｜よつば建設工業</title>
<link rel="apple-touch-icon" sizes="180x180" href="icons/icon-kakunin-180.png">
<link rel="apple-touch-icon" sizes="120x120" href="icons/icon-kakunin-120.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-kakunin-192.png">
<link rel="icon" type="image/png" sizes="60x60" href="icons/icon-kakunin-60.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="日報確認">
<meta name="theme-color" content="#1c4b34">
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<style>
  :root{
    --green:#1c4b34; --tint:#e6ede8;
    --ink:#201e1d; --muted:#605d5d; --faint:#7d7979; --dim:#9b9797;
    --line:rgba(32,30,29,.2); --line-s:rgba(32,30,29,.26); --line-w:rgba(32,30,29,.14);
    --paper:#f3f2f2; --card:#faf9f7; --field:#eae9e9;
    --mag:#d6006c; --mag-d:#8e0b4c;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{font-family:"Hiragino Sans","Yu Gothic UI","Noto Sans JP",sans-serif;
    background:var(--paper);color:var(--ink);line-height:1.6;}
  button{font-family:inherit;}
  .wrap{max-width:520px;margin:0 auto;padding:22px 20px 50px;}

  .brand{font-size:12px;letter-spacing:.14em;color:var(--muted);}
  h1.big{margin:10px 0 4px;font-size:34px;font-weight:700;letter-spacing:-.01em;line-height:1.1;}
  .sub{font-size:14px;color:var(--muted);}

  .bar-top{display:flex;align-items:center;gap:14px;padding:14px 20px;
    border-bottom:1px solid var(--line-w);background:var(--paper);position:sticky;top:0;z-index:5;}
  .bar-top .bk{background:transparent;border:none;font-size:16px;color:var(--muted);cursor:pointer;padding:4px 0;}
  .bar-top .tt{font-size:17px;font-weight:600;}
  .bar-top select{margin-left:auto;padding:8px;border:1px solid var(--line);border-radius:2px;
    background:var(--card);font-family:inherit;font-size:14px;color:var(--ink);}

  input[type=text]{width:100%;min-height:56px;padding:14px 16px;background:var(--field);
    border:1px solid var(--line);border-radius:2px;font-size:18px;color:var(--ink);outline:none;font-family:inherit;}
  input:focus{border:1.5px solid var(--green);}

  .step{font-size:13px;color:var(--muted);margin-bottom:8px;font-weight:600;}
  .ngrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  .nchip{height:62px;padding:0 6px;background:var(--card);color:var(--ink);border:1px solid var(--line-s);
    border-radius:2px;font-size:19px;white-space:nowrap;overflow:hidden;cursor:pointer;}
  .nchip:active{background:var(--tint);border-color:var(--green);}

  .vtabs{display:flex;gap:8px;margin-bottom:18px;}
  .vtabs button{flex:1;min-height:50px;padding:12px 8px;background:transparent;color:var(--ink);
    border:1px solid var(--line-s);border-radius:2px;font-size:17px;cursor:pointer;}
  .vtabs button.on{background:var(--green);color:#f3f2f2;border-color:var(--green);font-weight:600;}

  .bighours{font-size:46px;font-weight:700;line-height:1.1;}
  .bighours span{font-size:15px;font-weight:400;color:var(--muted);margin-left:10px;}
  .vday{padding:14px 0;border-bottom:1px solid var(--line-w);}
  .vday .d{font-size:14px;color:var(--muted);}
  .vday .j{margin-top:4px;font-size:17px;}
  .vday .j .no{font:600 16px/1.2 ui-monospace,monospace;letter-spacing:.05em;color:var(--green);margin-right:8px;}
  .vday .h{margin-top:4px;font-size:14px;color:var(--muted);}
  .vday.off .j{color:var(--muted);}
  .vsent{padding:15px 0;border-bottom:1px solid var(--line-w);}
  .vsent .at{font-size:13px;color:var(--faint);}
  .vsent .j{margin-top:5px;font-size:17px;}
  .vsent .j .no{font:600 16px/1.2 ui-monospace,monospace;letter-spacing:.05em;color:var(--green);margin-right:8px;}
  .vsent .s{margin-top:5px;font-size:14px;color:var(--muted);}
  .paybox{margin-top:26px;padding-top:20px;border-top:1px solid var(--line);}
  .paybox .n{font-size:40px;font-weight:700;}
  .paybox .n span{font-size:15px;font-weight:400;color:var(--muted);margin-left:8px;}
  .payrow{display:flex;align-items:baseline;justify-content:space-between;gap:10px;
    padding:10px 0;border-bottom:1px solid var(--line-w);font-size:15px;}
  .payrow .x{color:var(--faint);font-size:14px;}

  .note{font-size:13px;color:var(--faint);margin-top:14px;line-height:1.6;}
  .empty{text-align:center;color:var(--faint);font-size:14px;padding:40px 0;}
  .updated{font-size:11px;color:var(--faint);text-align:center;margin-top:16px;}
  .screen{display:none;} .screen.on{display:block;}
</style>
</head>
<body>

<div id="scNames" class="screen on">
<div class="wrap">
  <div class="brand">よつば建設工業</div>
  <h1 class="big">日報を見る</h1>
  <div class="sub">自分の記録・今月の工数</div>
  <div style="margin-top:24px"><input type="text" id="vSearch" placeholder="名前で探す"></div>
  <div id="vNameList" style="margin-top:18px"></div>
  <p class="note">自分の名前をタップすると、月ごとの日報が見られます。表示のみで、ここから記録は変えられません。</p>
  <p class="updated" id="updTop"></p>
</div>
</div>

<div id="scView" class="screen">
  <div class="bar-top">
    <button class="bk" onclick="backToNames()">戻る</button>
    <span class="tt" id="vTitle"></span>
    <select id="vMonth"></select>
  </div>
  <div class="wrap">
    <div class="vtabs" id="vTabs"></div>
    <div id="vMe">
      <div style="font-size:13px;color:var(--muted)" id="vMonthLbl"></div>
      <div class="bighours" id="vHours"></div>
      <div id="vDays" style="margin-top:18px"></div>
      <div class="paybox" id="vPay"></div>
      <div class="note">ここは自分の記録だけです。数字が違うときは職長か事務所に言ってください。</div>
    </div>
    <div id="vSent" style="display:none">
      <div class="note" style="margin-top:0">自分が職長で出した日報</div>
      <div id="vSentList" style="margin-top:10px"></div>
      <div class="note">他の職長が出した日報や、他人の月合計は見られません（事務所の管理画面のみ）。</div>
    </div>
  </div>
</div>

<script>
/* ================== Firebase ================== */
const firebaseConfig = {
  apiKey: "AIzaSyDRTF3YW0oTbMcN3cwsmMDJWoLX4HpVtPk",
  authDomain: "yotsuba-nippo.firebaseapp.com",
  databaseURL: "https://yotsuba-nippo-default-rtdb.firebaseio.com",
  projectId: "yotsuba-nippo",
  storageBucket: "yotsuba-nippo.firebasestorage.app",
  messagingSenderId: "1007360975873",
  appId: "1:1007360975873:web:ac229f3f4016b81e994c00"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const PAPER_KINDS = ["平日工場","平日現場","休日工場","休日現場","工場残業","現場残業","移動行き","移動帰り","早出","深夜","突発"];
const WD = ["日","月","火","水","木","金","土"];
const YAKUIN = ["野村","松高","高市","水元","井谷","本山","大西"];

let ALLDATA = {};
let V = { name:null, month:null, tab:"me" };

function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function isKana(s){ return /^[ァ-ヴー]+$/.test(s); }
function byLen(a,b){ return (isKana(a)-isKana(b))||(a.length-b.length)||a.localeCompare(b,"ja"); }
function f1(v){ return (Math.round((v||0)*10)/10).toFixed(1); }
function totalOf(h){ h=h||{}; return PAPER_KINDS.reduce((a,k)=>a+(h[k]||0),0); }
function netOf(r){ return Math.max(0, totalOf(r.h)-(r.late||0)-(r.early||0)); }
function monthRows(m){ return (ALLDATA[m]&&ALLDATA[m].rows)?ALLDATA[m].rows.filter(Boolean):[]; }
function allRows(){ return Object.keys(ALLDATA).reduce((a,m)=>a.concat(monthRows(m)),[]); }
function jobKey(r){ return r.no || r.j || ""; }
function dShort(ds){ const d=new Date(ds+"T00:00:00");
  return isNaN(d)?ds:((d.getMonth()+1)+"/"+d.getDate()+"（"+WD[d.getDay()]+"）"); }

db.ref("nippo").on("value", snap=>{
  ALLDATA = snap.val() || {};
  renderNames();
  if(V.name) renderView();
});

function showScreen(id){
  ["scNames","scView"].forEach(x=>document.getElementById(x).classList.toggle("on", x===id));
  window.scrollTo(0,0);
}
function backToNames(){ V.name=null; showScreen("scNames"); }

function renderNames(){
  const q=(document.getElementById("vSearch").value||"").trim();
  const map={};
  allRows().forEach(r=>{ if(r.n) map[r.n]=r.k||""; });
  const names=Object.keys(map);
  if(!names.length){
    document.getElementById("vNameList").innerHTML =
      '<div class="empty">まだ日報がありません。<br>職長さんの送信を待っています。</div>';
    document.getElementById("updTop").textContent="";
    return;
  }
  const own=names.filter(n=>map[n]==="自社"&&n.indexOf(q)>=0).sort(byLen);
  const par=names.filter(n=>map[n]!=="自社"&&n.indexOf(q)>=0).sort(byLen);
  let html="";
  if(own.length) html+='<div class="step">自社</div><div class="ngrid" style="margin-bottom:18px">'+
    own.map(n=>'<button class="nchip" data-n="'+esc(n)+'">'+esc(n)+'</button>').join("")+'</div>';
  if(par.length) html+='<div class="step">協力会社</div><div class="ngrid">'+
    par.map(n=>'<button class="nchip" data-n="'+esc(n)+'">'+esc(n)+'</button>').join("")+'</div>';
  document.getElementById("vNameList").innerHTML = html || '<div class="empty">該当する名前がありません</div>';
  document.querySelectorAll("#vNameList .nchip").forEach(b=>{ b.onclick=()=>openView(b.dataset.n); });

  const ms=Object.keys(ALLDATA).sort();
  const last=ms.length?ALLDATA[ms[ms.length-1]]:null;
  document.getElementById("updTop").textContent = last&&last.updatedAt ? "最終更新: "+last.updatedAt : "";
}
document.getElementById("vSearch").addEventListener("input", renderNames);

function openView(n){
  V.name=n; V.tab="me";
  const ms=Object.keys(ALLDATA).sort().reverse();
  V.month=ms[0]||null;
  const sel=document.getElementById("vMonth");
  sel.innerHTML=ms.map(m=>'<option value="'+m+'">'+m.replace("-","年")+'月</option>').join("");
  if(V.month) sel.value=V.month;
  showScreen("scView"); renderView();
}
document.getElementById("vMonth").addEventListener("change", e=>{ V.month=e.target.value; renderView(); });

function renderView(){
  document.getElementById("vTitle").textContent="日報を見る ─ "+V.name;
  const rows=monthRows(V.month);
  const mine=rows.filter(r=>r.n===V.name).sort((a,b)=>String(b.d).localeCompare(String(a.d)));
  const sent=rows.filter(r=>r.f===V.name);
  const hasSent=sent.length>0;

  const tabs=[{k:"me",l:"自分"}].concat(hasSent?[{k:"sent",l:"出した日報"}]:[]);
  if(!hasSent&&V.tab!=="me") V.tab="me";
  document.getElementById("vTabs").innerHTML=tabs.map(t=>
    '<button class="'+(V.tab===t.k?"on":"")+'" data-k="'+t.k+'">'+t.l+'</button>').join("");
  document.querySelectorAll("#vTabs button").forEach(b=>{
    b.onclick=()=>{ V.tab=b.dataset.k; renderView(); };
  });
  document.getElementById("vMe").style.display=V.tab==="me"?"block":"none";
  document.getElementById("vSent").style.display=V.tab==="sent"?"block":"none";

  const work=mine.filter(r=>!r.off);
  const total=work.reduce((a,r)=>a+netOf(r),0);
  const days=new Set(work.map(r=>r.d)).size;
  document.getElementById("vMonthLbl").textContent=(V.month||"").replace("-","年")+"月";
  document.getElementById("vHours").innerHTML=f1(total)+'<span>時間 ／ '+days+'日出勤</span>';
  document.getElementById("vDays").innerHTML=mine.length?mine.map(r=>{
    const h=r.h||{};
    const d=PAPER_KINDS.filter(k=>h[k]).map(k=>k+" "+f1(h[k])).join(" ・ ");
    return '<div class="vday'+(r.off?" off":"")+'"><div class="d">'+dShort(r.d)+'</div>'+
      '<div class="j">'+(r.no?'<span class="no">'+esc(r.no)+'</span>':'')+esc(r.j||"")+'</div>'+
      '<div class="h">'+(r.off?esc(r.offReason||"休み"):esc(d||"―"))+
      (r.f?" ─ 職長 "+esc(r.f):"")+'</div></div>';
  }).join(""):'<div class="empty">この月の記録はありません</div>';

  const bt={};
  sent.filter(r=>!r.off).forEach(r=>{ const k=r.batch||(r.d+"|"+jobKey(r)); (bt[k]=bt[k]||[]).push(r); });
  const keys=Object.keys(bt).sort((a,b)=>String(bt[b][0].d).localeCompare(String(bt[a][0].d)));
  let payN=0;
  const payRows=keys.map(k=>{
    const g=bt[k], r=g[0];
    const net=g.filter(x=>x.n!==V.name&&YAKUIN.indexOf(x.n)<0);
    payN+=net.length;
    return '<div class="payrow"><span>'+dShort(r.d)+'　'+esc(r.j||"")+
      (r.f&&r.f!==V.name?" ─ 職長 "+esc(r.f):"")+'</span>'+
      '<span class="'+(net.length?"":"x")+'">'+(net.length?net.length:"対象外")+'</span></div>';
  }).join("");
  document.getElementById("vPay").innerHTML=hasSent?
    '<div class="step">職長手当（'+(V.month||"").replace("-","年")+'月）</div>'+
    '<div class="n">'+payN+'<span>人分 ／ 日報から自動で計算</span></div>'+
    '<div style="margin-top:12px">'+payRows+'</div>':"";

  document.getElementById("vSentList").innerHTML=keys.length?keys.map(k=>{
    const g=bt[k], r=g[0];
    const offs=rows.filter(x=>x.off&&x.batch===r.batch);
    const t=g.reduce((a,x)=>a+netOf(x),0);
    return '<div class="vsent"><div class="at">'+dShort(r.d)+(r.at?"　"+esc(String(r.at).split(" ")[1]||"")+" 送信":"")+'</div>'+
      '<div class="j">'+(r.no?'<span class="no">'+esc(r.no)+'</span>':'')+esc(r.j||"")+'</div>'+
      '<div class="s">'+g.length+'人 ／ 合計 '+f1(t)+'時間'+(offs.length?' ／ 休み '+offs.length+'人':'')+'</div></div>';
  }).join(""):'<div class="empty">この月に出した日報はありません</div>';
}
</script>
</body>
</html>
